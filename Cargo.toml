[package]
name = "simple-vm-manager"
version = "1.8.5"
edition = "2021"
description = "A simple desktop console for XenServer / XCP-ng pools and their VMs' screens (Linux, Windows, macOS)"
license = "MIT"
readme = "README.md"
keywords = ["xen", "xcp-ng", "virtualization", "egui", "desktop"]
categories = ["gui", "virtualization"]

[[bin]]
name = "simple-vm-manager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "glow", "accesskit", "wayland", "x11"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde_json = "1"
flate2 = "1" # the VM console's ZRLE pictures
# saved passwords live in the system's keychain: Secret Service (GNOME Keyring, KWallet, KeePassXC)
# on Linux, Credential Manager on Windows, Keychain on macOS
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18" # the system's file chooser (an XDG portal on Linux), to pick ISO files to upload
pollster = "1" # waits for the file chooser on a worker thread
tar = { version = "0.4", default-features = false } # unpacks a new version's archive (updates)

# egui's wgpu comes without the DirectX 12 backend; Windows needs it (it also has a software fallback,
# WARP, for computers without a graphics driver).
[target.'cfg(windows)'.dependencies]
wgpu = { version = "22.1", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
