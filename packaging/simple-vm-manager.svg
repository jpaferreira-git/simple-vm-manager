<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26526f"/>
      <stop offset="1" stop-color="#3a8c8c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <!-- three stacked servers -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <rect x="30" y="28" width="68" height="18" rx="5"/>
    <rect x="30" y="54" width="68" height="18" rx="5"/>
    <rect x="30" y="80" width="68" height="18" rx="5"/>
  </g>
  <g fill="#ffffff">
    <rect x="40" y="35" width="22" height="4" rx="2"/>
    <rect x="40" y="61" width="22" height="4" rx="2"/>
    <rect x="40" y="87" width="22" height="4" rx="2"/>
  </g>
  <!-- status lights -->
  <circle cx="86" cy="37" r="5" fill="#3fb950"/>
  <circle cx="86" cy="63" r="5" fill="#3fb950"/>
  <circle cx="86" cy="89" r="5" fill="#f0a030"/>
</svg>
