# Builds the Linux version on every push, and attaches a ready-to-run Linux archive to a GitHub
# release whenever a tag like v1.0.0 is pushed.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/simple-vm-manager
          cp target/release/simple-vm-manager dist/simple-vm-manager/
          cp -r packaging install.sh README.md LICENSE assets/fonts/LICENSE-Inter.txt dist/simple-vm-manager/
          tar -C dist -czf simple-vm-manager-linux-x86_64.tar.gz simple-vm-manager
      - uses: actions/upload-artifact@v4
        with:
          name: simple-vm-manager-linux-x86_64
          path: simple-vm-manager-linux-x86_64.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: simple-vm-manager-linux-x86_64.tar.gz
